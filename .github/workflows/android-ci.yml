name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Permissão mínima para o token do workflow
permissions:
  contents: read

# Cancela execuções antigas da mesma branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Testes unitários
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar o código
        uses: actions/checkout@v5

      - name: Configurar o JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Configurar o Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Rodar os testes unitários
        run: ./gradlew testDebugUnitTest --tests "com.example.calculadoraimc.domain.*"

      - name: Enviar relatório de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes-unitarios
          path: app/build/reports/tests/
          retention-days: 7

  integration:
    name: Testes de integração
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar o código
        uses: actions/checkout@v5

      - name: Configurar o JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Configurar o Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Rodar os testes de integração
        run: ./gradlew testDebugUnitTest --tests "com.example.calculadoraimc.integration.*"

      - name: Enviar relatório de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes-integracao
          path: app/build/reports/tests/
          retention-days: 7

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar o código
        uses: actions/checkout@v5

      - name: Configurar o JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Configurar o Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Rodar o lint
        run: ./gradlew lintDebug

      - name: Enviar relatório de lint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-lint
          path: app/build/reports/lint-results-debug.html
          retention-days: 7

  build:
    name: Build do APK de depuração
    needs: [test, integration, lint]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar o código
        uses: actions/checkout@v5

      - name: Configurar o JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Configurar o Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Gerar o APK
        run: ./gradlew assembleDebug

      - name: Enviar o APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
